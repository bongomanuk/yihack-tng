name: Build and release h264grabber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched grabber and RTSP server
        run: |
          docker run --rm --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/build" -w /build \
            docker.io/borodiliz/yi-hack:latest \
            -lc 'sed -i "s|http://archive.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g" /etc/apt/sources.list && apt-get update && apt-get install -y libtool && ./scripts/compile.sh h264grabber && mkdir -p /tmp/tng-bin && cp build/home/yi-hack/bin/h264grabber build/home/yi-hack/bin/h264grabber2 /tmp/tng-bin/ && ./scripts/compile.sh rRTSPServer && cp /tmp/tng-bin/h264grabber /tmp/tng-bin/h264grabber2 build/home/yi-hack/bin/'

      - name: Package per-model release assets
        run: ./scripts/package_release.sh "$GITHUB_REF_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yihack-tng
          path: dist/*.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
