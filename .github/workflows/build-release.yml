name: Build and release h264grabber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched grabber
        run: |
          docker run --rm --network none --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/build" -w /build \
            docker.io/borodiliz/yi-hack:latest \
            -lc './scripts/compile.sh h264grabber'

      - name: Package release
        run: |
          mkdir -p release
          cp build/home/yi-hack/bin/h264grabber release/
          cp build/home/yi-hack/bin/h264grabber2 release/
          cp src/static/static/home/yi-hack/script/wd.sh release/
          cp src/static/static/home/yi-hack/script/service.sh release/
          cp src/static/static/home/yi-hack/script/system.sh release/
          chmod 755 release/*
          tar -czf "yihack-tng-${GITHUB_REF_NAME}.tar.gz" -C release .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yihack-tng
          path: yihack-tng-*.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yihack-tng-*.tar.gz
          generate_release_notes: true
