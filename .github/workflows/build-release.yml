name: Build and release h264grabber

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build patched grabber
        run: |
          docker run --rm --network none --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/build" -w /build \
            docker.io/borodiliz/yi-hack:latest \
            -lc './scripts/compile.sh h264grabber'

      - name: Package per-model release assets
        run: ./scripts/package_release.sh "$GITHUB_REF_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yihack-tng
          path: dist/*.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
